# .github/workflows/snake.yml
# emrekybs/emrekybs repo'suna bu dosyayı ekle -> contribution grafiğini yiyen yılan animasyonu üretir.
# Settings > Actions > General > Workflow permissions -> "Read and write permissions" açık olmalı.

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: emrekybs
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#F70000&color_dots=#161B22,#8B0000,#B22222,#F70000,#FF4C4C

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
