<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06090F"/><stop offset=".55" stop-color="#0B1220"/><stop offset="1" stop-color="#070A11"/></linearGradient>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#1A2436"/></pattern>
<linearGradient id="ol" x1="0" x2="1"><stop offset="0" stop-color="#FF7A1A" stop-opacity="0"/><stop offset=".5" stop-color="#FF7A1A"/><stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF7A1A" stop-opacity="0"/><stop offset="1" stop-color="#FF7A1A" stop-opacity=".5"/></linearGradient>
<radialGradient id="glowO" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF7A1A" stop-opacity=".18"/><stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4C8DFF" stop-opacity=".16"/><stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/></radialGradient>
<style>
.pulse{animation:p 2.4s ease-in-out infinite}@keyframes p{0%,100%{opacity:.3}50%{opacity:1}}
.blink{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.flow{stroke-dasharray:3 5;animation:f 2.5s linear infinite}@keyframes f{to{stroke-dashoffset:-32}}
.grow{animation:g 1.8s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left}@keyframes g{from{transform:scaleX(0)}}
.spin{animation:s 14s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes s{to{transform:rotate(360deg)}}
.hx{animation:h 6.5s ease-in-out infinite;opacity:0}@keyframes h{0%,100%{opacity:0}8%{opacity:1}22%{opacity:0}}
</style></defs><rect width="1000" height="190" rx="12" fill="url(#bg)"/><rect width="1000" height="190" rx="12" fill="url(#dots)"/><rect x=".5" y=".5" width="999" height="189" rx="12" fill="none" stroke="#1E2A3D"/>
<text x="500" y="44" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="10.5" fill="#FF7A1A" text-anchor="middle" letter-spacing="3">[ TRANSMISSION // DECRYPTED ]</text>
<text x="500" y="82" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#F2F4F8" text-anchor="middle">Searching for vulnerabilities in machines is foolish.</text>
<text x="500" y="112" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#FF7A1A" text-anchor="middle">Look for vulnerabilities in the deep desires of humans.</text>
<line x1="440" y1="134" x2="560" y2="134" stroke="#1E2A3D"/>
<text x="500" y="160" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#7D8798" text-anchor="middle" font-style="italic">"The quieter you become, the more you are able to hear."</text>
<rect x="0" y="187" width="1000" height="3" fill="url(#ol)"/></svg>