name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF7A1A&color_dots=#111A2B,#1B3460,#2B5BB5,#4C8DFF,#9DBBFF&color_background=#0B1220
            dist/snake-light.svg?color_snake=#FF7A1A&color_dots=#EEF2F8,#BFD1F5,#86A9EE,#4C8DFF,#1F4FB8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
